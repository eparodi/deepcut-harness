{{define "content"}}
<h1>Skills</h1>
<p class="muted">The hands: a runtime + allowed commands. <a href="/skills/wizard" hx-get="/skills/wizard" hx-target=".main-wrap" hx-push-url="true">Create a skill</a></p>
{{if .Skills}}
<div class="table-scroll">
<table>
  <tr><th>name</th><th>runtime</th><th>category</th></tr>
  {{range .Skills}}
  <tr><td>{{.Name}}</td><td>{{.Runtime}}</td><td>{{.Category}}</td></tr>
  {{end}}
</table>
</div>
{{else}}
<p class="muted">no skills yet.</p>
{{end}}
{{end}}
